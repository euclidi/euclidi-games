app.canvas.addEventListener('pointerdown',e=>{if(drag!==null||panDrag)return;let p=loc(e);app.canvas.setPointerCapture(e.pointerId);if(Math.hypot(p.x-START.x,p.y-START.y)<60){drag=e.pointerId;aim(p)}else panDrag={id:e.pointerId,x:e.clientX,p:pan}});app.canvas.addEventListener('pointermove',e=>{if(drag===e.pointerId)aim(loc(e));else if(panDrag?.id===e.pointerId){pan=clamp(panDrag.p+e.clientX-panDrag.x,-app.screen.width,app.screen.width);fit()}});app.canvas.addEventListener('pointerup',e=>{if(drag===e.pointerId){drag=null;fire(loc(e))}if(panDrag?.id===e.pointerId)panDrag=null});app.canvas.addEventListener('pointercancel',()=>{drag=panDrag=null;aimG.clear();loaded.r.position.set(START.x,START.y)});app.canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom-e.deltaY*.001,.7,2.3);fit()},{passive:false});document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>reset(+b.dataset.b));$('robot').onclick=()=>{robot=robot==='bolt'?'titan':'bolt';$('robot').textContent=robot.toUpperCase();load()};$('test').onclick=()=>fire({x:START.x-95,y:START.y+37});$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'};$('slow').onclick=()=>{slow=!slow;$('slow').classList.toggle('active',slow)};$('debug').onclick=()=>{debug=!debug;$('debug').classList.toggle('active',debug)};$('light').onclick=()=>{light=!light;objects.forEach(shade)};$('plus').onclick=()=>{zoom=clamp(zoom+.15,.7,2.3);fit()};$('minus').onclick=()=>{zoom=clamp(zoom-.15,.7,2.3);fit()};$('reset').onclick=()=>{pan=0;zoom=1;reset(biome);fit()};window.addEventListener('resize',()=>setTimeout(fit,50));reset(0);fit();app.ticker.add(tick);window.__scrap={get shots(){return shots},get targets(){return targets},get bodies(){return sim.getBodyCount()},get score(){return score}};
}catch(e){$('error').textContent='Unable to initialize: '+e.message;$('details').textContent='Initialization failed';console.error(e)}
</script></body></html>

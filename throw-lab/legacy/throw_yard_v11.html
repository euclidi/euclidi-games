function noiseTexture(kind,size=512){const c=document.createElement('canvas');c.width=c.height=size;let x=c.getContext('2d'),a=x.createImageData(size,size),data=a.data,b=kind==='grass'?[98,123,73]:kind==='paver'?[137,133,116]:kind==='wood'?[112,77,52]:[117,108,96];for(let i=0;i<data.length;i+=4){let n=(Math.random()-.5)*39;data[i]=b[0]+n;data[i+1]=b[1]+n;data[i+2]=b[2]+n;data[i+3]=255}x.putImageData(a,0,0);if(kind==='wood'){for(let i=0;i<230;i++){x.beginPath();x.strokeStyle='rgba(29,23,16,.12)';const yy=rand(0,size);x.moveTo(0,yy);x.bezierCurveTo(size*.3,yy-3,size*.8,yy+3,size,yy);x.stroke()}}const t=new THREE3.CanvasTexture(c);t.wrapS=t.wrapT=THREE3.RepeatWrapping;t.colorSpace=THREE3.SRGBColorSpace;t.anisotropy=4;return t}

for(let y=0;y<512;y++)for(let xx=0;xx<1024;xx++){const i=(y*1024+xx)*4,n=(Math.random()-.5)*12;let rgb=[195,55,46];if(kind==='capture')rgb=Math.abs(y-256)<22?[35,42,43]:y<256?[186,48,41]:[226,224,211];if(kind==='bowling'){let waves=Math.sin(xx*.023+y*.044)*18+Math.sin(xx*.057-y*.012)*12;rgb=[44+waves,36+waves*.5,72+waves*1.8]}if(kind==='moon'){let f=Math.sin(xx*.1)*Math.sin(y*.08)*13;rgb=[140+f,143+f,144+f]}if(kind==='candy'){let a=Math.sin(xx*.035+y*.048);rgb=a>.18?[235,89,136]:a<-.16?[250,228,188]:[133,201,196]}if(kind==='energy'){let a=Math.sin(xx*.075+y*.03)*25;rgb=[25+a*.3,117+a,193+a]}if(kind==='dragon'){let a=Math.sin(xx*.027+y*.038)*6;rgb=[255+a,165+a,35+a]}if(kind==='basketball'){let pebble=Math.sin(xx*.83)*Math.sin(y*.87)*4;rgb=[193+pebble,104+pebble*.6,51+pebble*.4]}

function integrateNet(h){

function update(dt){

 // Fixtures and spotlights are updated by setLighting(), not just ambient.
 if(gesture&&shotMode==='jump')updateJumpPose((performance.now()-gesture.startTime)/1000);
 if(targetType==='cans')updateCans(dt);
 if(shot)physicsStep(dt);
 else if(!gesture){
  ball.position.y=origin.y+Math.sin(clock*2.4)*.016;ballRotor.rotation.y+=dt*.23;
  if(targetType==='hoop'){physicsAccumulator+=dt;while(physicsAccumulator>=PHYSICS_DT){integrateNet(PHYSICS_DT);physicsAccumulator-=PHYSICS_DT;}}
 }
 if(gesture&&shotMode==='curve'&&gesture.charge>.2)ballRotor.rotation.z+=gesture.sign*gesture.charge*dt*20;
 shadow.position.set(ball.position.x,.12,ball.position.z);shadow.material.opacity=clamp(.19-ball.position.y*.019,.025,.18);
 if(autoReset&&clock>autoReset){resetObjects();autoReset=0}
 const camP=V(0,2.65,7.65),camT=V(0,2.35,-6.3);
 if(followCamera&&shot&&shot.age>.18&&shot.missDelay<0&&(!shot.scored||shot.age-shot.scoredAt<.5)){
  const z=T[targetType].z;camP.set(1.3,targetType==='hoop'?3.48:2.8,z+4.9);camT.set(0,targetType==='hoop'?3.04:1.1,z);
 }
 const hurry=shot&&shot.missDelay>=0;
 camera.position.lerp(camP,hurry?1:Math.min(1,dt*3.7));
 if(!camLook)camLook=V(0,2.35,-6.3);
 camLook.lerp(camT,hurry?1:Math.min(1,dt*4));camera.lookAt(camLook);
 if(targetType==='hoop')syncNetVisual();
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];if(!p.mesh)continue;p.ttl-=dt;
  if(p.ttl<=0){scene.remove(p.mesh);p.mesh.material.dispose();particles.splice(i,1);continue}
  p.v.y-=6*dt;p.mesh.position.addScaledVector(p.v,dt);p.mesh.scale.setScalar(clamp(p.ttl/p.life,.01,1));}
 if(toastEnd&&performance.now()>toastEnd){msg.classList.remove('on');toastEnd=0}
 overlayDraw();
}
function frame(now){if(!ready)return;let dt=clamp((now-last)/1000,.001,.034);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(frame)}

name: Impact Works asset acquisition
on:
  push:
    branches: [main]
    paths: ['brick-breaker/tools/install-art.py', '.github/workflows/brick-breaker-art.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python brick-breaker/tools/install-art.py
      - name: Publish only reviewed-source bitmap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brick-breaker/assets/materials brick-breaker/assets/sound
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add CC0 material artwork and impact sounds to Impact Works'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

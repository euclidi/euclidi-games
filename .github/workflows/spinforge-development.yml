name: Spinforge development validation
on:
  push:
    paths:
      - 'spinforge/**'
      - '.github/workflows/spinforge-development.yml'
  pull_request:
    paths:
      - 'spinforge/**'
      - '.github/workflows/spinforge-development.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node spinforge/tests/core.mjs
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 > /tmp/spinforge-server.log 2>&1 &
          node spinforge/tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinforge-browser-evidence
          path: spinforge/test-artifacts/

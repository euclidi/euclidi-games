name: Soul Reaper browser smoke
on:
  push:
    branches: [soul-reaper-v080]
    paths:
      - 'soul-reaper/**'
      - '.github/workflows/soul-reaper-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/reaper-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/soul-reaper/ >/dev/null && break; sleep 1; done
          node soul-reaper/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soul-reaper-smoke-screens
          path: artifacts/soul-reaper/

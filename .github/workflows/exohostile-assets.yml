name: EXOHOSTILE asset preparation
on:
  push:
    branches: [exohostile-visual-overhaul]
    paths:
      - 'exohostile/tools/**'
      - 'exohostile/index.html'
      - '.github/workflows/exohostile-assets.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'exohostile/**'
      - '.github/workflows/exohostile-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exohostile-assets-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/exohostile-visual-overhaul' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'exohostile-visual-overhaul')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and fetch authored assets
        run: |
          node --check exohostile/tools/prepare-assets.mjs
          node --check exohostile/tools/smoke-test.mjs
          node exohostile/tools/prepare-assets.mjs
      - name: Browser smoke test
        run: |
          npm install --no-save --no-package-lock --prefix exohostile/tools playwright@1.56.1
          exohostile/tools/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 > /tmp/exo-server.log 2>&1 &
          node exohostile/tools/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exohostile-smoke
          path: |
            exohostile-smoke.png
            exohostile/assets/manifest.json
          if-no-files-found: ignore
      - name: Commit validated local assets to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exohostile/assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor validated EXOHOSTILE CC0 assets"
          git push origin HEAD:exohostile-visual-overhaul

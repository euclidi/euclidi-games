name: Publish PAC-MAN to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'pacman/**'
      - '.github/workflows/pacman-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Install, test and build
        working-directory: pacman
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build -- --base=/euclidi-games/pacman/
      - name: Assemble site
        run: |
          mkdir -p site/pacman
          cp -r pacman/dist/. site/pacman/
          printf '<!doctype html><html lang="en"><meta charset="utf-8"><title>Euclidi Games</title><body style="background:#000;color:#fff;font-family:monospace"><h1>Euclidi Games</h1><a style="color:#ff0" href="./pacman/">Play PAC-MAN</a></body></html>' > site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

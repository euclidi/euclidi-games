name: Dummy Lab W1.13 browser validation
on:
  push:
    branches: [main]
    paths: ['dummy-lab-w18/**','.github/workflows/dummy-lab-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node dummy-lab-w18/controls-audit.mjs
          node dummy-lab-w18/locomotion-audit.mjs
          node --check dummy-lab-w18/gait.js
          node --check dummy-lab-w18/behavior.js
          node --check dummy-lab-w18/vending.js
          node --check dummy-lab-w18/main.js
          node --check dummy-lab-w18/monitors.js
          node --check dummy-lab-w18/room.js
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1 three@0.180.0 @dimforge/rapier3d-compat@0.17.3
          npx playwright install --with-deps chromium
      - name: Browser audit using pinned local dependency bytes
        run: |
          mkdir -p "$RUNNER_TEMP/site/dummy-lab-w18/vendor/three" "$RUNNER_TEMP/site/dummy-lab-w18/vendor/rapier"
          cp -r dummy-lab-w18/. "$RUNNER_TEMP/site/dummy-lab-w18/"
          cp -r node_modules/three/build/. "$RUNNER_TEMP/site/dummy-lab-w18/vendor/three/"
          cp -r node_modules/@dimforge/rapier3d-compat/. "$RUNNER_TEMP/site/dummy-lab-w18/vendor/rapier/"
          cp favicon.ico "$RUNNER_TEMP/site/" || true
          mkdir -p "$RUNNER_TEMP/site/assets"
          cp -r assets/brand "$RUNNER_TEMP/site/assets/"
          sed -i 's|https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js|./vendor/three/three.module.js|;s|https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.17.3/rapier.es.js|./vendor/rapier/rapier.es.js|' "$RUNNER_TEMP/site/dummy-lab-w18/index.html"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/dummy-http.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/dummy-lab-w18/ >/dev/null 2>&1 && break; sleep 1; done
          xvfb-run -a node dummy-lab-w18/browser-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dummy-w113-browser-screenshots
          path: dummy-w113-*.png
          if-no-files-found: ignore

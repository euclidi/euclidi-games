name: Snake browser and simulation checks
on:
  push:
    paths: ['snake/**', 'index.html', '.github/workflows/snake-check.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node snake/model.test.mjs
      - run: node --check snake/game.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/snake-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/snake/ >/dev/null && break; sleep 1; done
          node snake/browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snake-screenshots
          path: snake-*.png

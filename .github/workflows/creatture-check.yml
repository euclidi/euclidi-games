name: Creatture development checks
on:
  push:
    branches: [creatture-r3]
    paths: ['creatture/**', '.github/workflows/creatture-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creatture
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --manifest-path engine/Cargo.toml
      - run: cargo install wasm-pack --locked
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: creatture-development-build
          path: creatture/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: creatture-test-results
          path: creatture/test-results
          if-no-files-found: ignore

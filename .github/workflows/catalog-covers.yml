name: Capture and audit game covers
on:
  push:
    branches: [main]
    paths: ['index.html','covers/**','tools/capture-covers.mjs','tools/publish-covers.py','.github/workflows/catalog-covers.yml']
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-capture existing gameplay covers (approved box art is retained)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: catalog-covers
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and pinned dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual gameplay frames
        env:
          REFRESH_COVERS: ${{ inputs.refresh || 'false' }}
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/site/euclidi-games"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/covers-http.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/euclidi-games/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/euclidi-games/ >/dev/null
          node tools/capture-covers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: actual-gameplay-frames
          path: cover-captures/
          if-no-files-found: error
  publish:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: actual-gameplay-frames
          path: cover-captures
      - name: Commit validated cover images and markup
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          python tools/publish-covers.py --captures cover-captures --allow-incomplete
          git add index.html covers/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Publish captured gameplay covers with source provenance"
            git push origin HEAD:main
            echo "PUBLISHED_COVER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Request existing branch-based Pages rebuild
        if: env.PUBLISHED_COVER_COMMIT != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Require real covers for every listed game
        if: always()
        run: python tools/publish-covers.py --check

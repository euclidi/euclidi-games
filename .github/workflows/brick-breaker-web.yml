name: Brick Breaker web playtest
on:
  push:
    paths: ['brick-breaker/**', '.github/workflows/brick-breaker-web.yml', 'index.html']
  pull_request:
    paths: ['brick-breaker/**', '.github/workflows/brick-breaker-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bb-server.log 2>&1 &
          for i in {1..20}; do curl -fs http://127.0.0.1:8765/brick-breaker/ && break; sleep 1; done
          node brick-breaker/web-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brick-breaker-browser-screens
          path: brick-breaker-*.png
          if-no-files-found: warn

name: Harvest 96 browser QA
on:
  push:
    branches: [harvest-96-development]
    paths: ['harvest-96/**', '.github/workflows/harvest-96-qa.yml']
  pull_request:
    branches: [main]
    paths: ['harvest-96/**', '.github/workflows/harvest-96-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node harvest-96/qa/logic.mjs
      - run: |
          cd harvest-96
          npm install --no-save --package-lock=false phaser@4.2.1 playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 >/tmp/harvest-http.log 2>&1 &
          node harvest-96/qa/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-96-qa
          path: harvest-*.png
          if-no-files-found: ignore

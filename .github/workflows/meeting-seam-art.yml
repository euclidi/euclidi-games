name: Meeting Seam asset bake
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'meeting-seam/art-src/**'
      - '.github/workflows/meeting-seam-art.yml'
permissions:
  contents: write
concurrency:
  group: meeting-seam-art
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'spritekiln[fast]'
      - name: Render model atlases
        run: |
          set -e
          mkdir -p meeting-seam/assets
          for name in arthur elias cart barrow fixture rock timber steelpost rail; do
            spritekiln render meeting-seam/art-src/$name.yaml
            dir=meeting-seam/art-src/out/$name
            cp "$dir/$name.png" "$dir/$name.json" meeting-seam/assets/
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          for name in ('arthur','elias'):
              p=Path('meeting-seam/assets')
              d=json.loads((p/(name+'.json')).read_text())
              im=Image.open(p/(name+'.png'))
              assert d['spritekiln']['frame_size']==128
              assert all(a in d['spritekiln']['animations'] for a in ('idle','walk','mine','work'))
              assert im.width>=128 and im.height>=128 and im.mode=='RGBA'
          for name in ('cart','barrow','fixture','rock','timber','steelpost','rail'):
              p=Path('meeting-seam/assets')
              d=json.loads((p/(name+'.json')).read_text())
              im=Image.open(p/(name+'.png'))
              assert d['spritekiln']['frame_size']==128 and im.mode=='RGBA'
              assert im.getbbox() is not None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-seam-atlases
          path: meeting-seam/assets/
      - name: Commit baked sprites
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meeting-seam/assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bake Meeting Seam 3D sprite atlases"
          git pull --rebase origin main
          git push origin HEAD:main

name: RICOCHET browser smoke
on:
  push:
    paths:
      - 'ricochet/**'
      - '.github/workflows/ricochet-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ricochet/test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ricochet-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ricochet/ >/dev/null && break; sleep 1; done
          node ricochet/smoke.mjs

name: Night Watch graphics verification
on:
  pull_request:
    paths:
      - 'night-watch/**'
      - '.github/workflows/night-watch-graphics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test night-watch/test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.51.1 && npx playwright install --with-deps chromium
      - name: Desktop and touch smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/night-watch-http.log 2>&1 &
          mkdir -p night-watch-audit
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          for(const [name,options] of [['desktop',{viewport:{width:1440,height:900}}],['portrait',{viewport:{width:390,height:844},isMobile:true,hasTouch:true}],['landscape',{viewport:{width:844,height:390},isMobile:true,hasTouch:true}]]){
            const p=await browser.newPage(options),errors=[];
            p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:8765/night-watch/');
            await p.waitForFunction(()=>document.documentElement.dataset.gameReady==='true');
            await p.locator('#play').click();
            await p.locator('#overlay').waitFor({state:'hidden'});
            await p.waitForTimeout(500);
            const pixel=await p.locator('#game').evaluate(c=>({w:c.width,h:c.height,data:[...c.getContext('2d').getImageData(0,0,c.width,c.height).data.filter((v,i)=>i%4===0)]}));
            assert.equal(pixel.w,640);assert.equal(pixel.h,400);assert(new Set(pixel.data).size>30,'insufficient rendered tonal variation');
            assert(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth&&document.documentElement.scrollHeight<=innerHeight));
            if(name==='desktop'){await p.keyboard.down('KeyW');await p.waitForTimeout(350);await p.keyboard.up('KeyW');await p.keyboard.press('Space');await p.keyboard.press('KeyM')}
            else{assert(await p.locator('#touch').isVisible());await p.locator('#fire').tap()}
            await p.screenshot({path:'night-watch-audit/'+name+'.png'});
            await p.locator('#pause').click();await p.locator('#overlay').waitFor({state:'visible'});
            assert.deepEqual(errors,[]);await p.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-watch-graphics-screenshots
          path: night-watch-audit/

name: Innuendo Town browser QA
on:
  push:
    branches: [dev/innuendo-town, fix/innuendo-town-sprites]
    paths: ['innuendo-town/**', '.github/workflows/innuendo-town-qa.yml']
  pull_request:
    branches: [main]
    paths: ['innuendo-town/**', '.github/workflows/innuendo-town-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node innuendo-town/qa/logic.mjs
      - run: |
          cd innuendo-town
          npm install --no-save --package-lock=false phaser@3.90.0 playwright@1.56.1
          mkdir -p vendor
          cp node_modules/phaser/dist/phaser.min.js vendor/phaser.min.js
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 >/tmp/town-http.log 2>&1 &
          node innuendo-town/qa/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: innuendo-town-qa
          path: town-*.png
          if-no-files-found: ignore
      - name: Refresh corrected game cover
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/innuendo-town-sprites'
        run: |
          python3 -m pip install --break-system-packages Pillow
          python3 innuendo-town/qa/package_preview.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers/manifest.json covers/innuendo-town-gameplay.webp
          git commit -m "Refresh Innuendo Town cover from tested sprite correction"
          git push origin HEAD:fix/innuendo-town-sprites

name: Guacamole browser regression
on:
  push:
    paths:
      - 'guacamole/**'
      - '.github/workflows/guacamole-browser-check.yml'
  pull_request:
    paths:
      - 'guacamole/**'
      - '.github/workflows/guacamole-browser-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/guacamole-http.log 2>&1 &
          node guacamole/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guacamole-browser-captures
          path: guacamole-*.png
          if-no-files-found: ignore

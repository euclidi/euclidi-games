name: Lunar Angler validation
on:
  push:
    paths:
      - 'lunar-angler/**'
      - '.github/workflows/lunar-angler.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node lunar-angler/test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lunar-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/lunar-angler/ >/dev/null && break; sleep 1; done
          node lunar-angler/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-browser-screenshots
          path: lunar-*.png
          if-no-files-found: ignore

name: Backyard Astronaut V2 validation
on:
  push:
    branches: [main]
    paths: ['backyard-astronaut/v2/**','.github/workflows/backyard-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Numerical tests
        run: |
          node --check backyard-astronaut/v2/game.mjs
          node --check backyard-astronaut/v2/art.mjs
          node --test backyard-astronaut/v2/orbit.test.mjs
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --no-package-lock three@0.180.0 @dimforge/rapier3d-compat@0.17.3 playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Raster asset mesh tests
        run: node --test backyard-astronaut/v2/art.test.mjs
      - name: Local bundle and browser smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/site" screenshots
          cp -r backyard-astronaut/v2 "$RUNNER_TEMP/site/v2"
          mkdir -p "$RUNNER_TEMP/site/v2/vendor/three" "$RUNNER_TEMP/site/v2/vendor/rapier"
          cp -r node_modules/three/build/. "$RUNNER_TEMP/site/v2/vendor/three/"
          cp -r node_modules/@dimforge/rapier3d-compat/. "$RUNNER_TEMP/site/v2/vendor/rapier/"
          sed -i 's|https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js|./vendor/three/three.module.js|;s|https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.17.3/rapier.es.js|./vendor/rapier/rapier.es.js|' "$RUNNER_TEMP/site/v2/index.html"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > /tmp/backyard-http.log 2>&1 &
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8766/v2/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1280,height:800}});let errors=[];page.on('pageerror',e=>errors.push(e.message));
          try {
            await page.goto('http://127.0.0.1:8766/v2/');
            await page.waitForFunction(()=>document.documentElement.dataset.gameReady==='true',{},{timeout:60000});
            await page.waitForTimeout(1000);
            let s=await page.evaluate(()=>window.baV2.snapshot());assert(s.webgl&&s.rapier&&s.draws>5);assert(s.art.some(a=>a.kind==='capsule'&&a.N>=44&&a.faces>100));console.log(JSON.stringify(s.art));
            await page.keyboard.down('w');await page.waitForTimeout(600);await page.keyboard.up('w');let t=await page.evaluate(()=>window.baV2.snapshot());assert(Math.hypot(t.player[0]-s.player[0],t.player[2]-s.player[2])>.5);
            await page.locator('#save').click();await page.locator('#load').click();assert((await page.evaluate(()=>window.baV2.snapshot())).parts[0].id===s.parts[0].id);
            assert.equal(errors.length,0,errors.join('; '));console.log('PASS actual WebGL2, Rapier, movement and save/load smoke test');
          } finally {await page.screenshot({path:'screenshots/v2.png'}).catch(()=>{});await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backyard-v2-screenshots
          path: screenshots/
          if-no-files-found: ignore

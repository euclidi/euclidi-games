name: Project documentation audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check project documentation and catalog links
        run: python3 tools/check_project_docs.py
      - name: Check return-to-catalog links for every game entry
        run: python3 tools/check_catalog_returns.py

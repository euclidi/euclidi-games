name: Dracula crypt browser smoke
on:
  push:
    paths:
      - 'draculas-crypt/**'
      - '.github/workflows/draculas-crypt-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 three@0.160.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/crypt-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/draculas-crypt/ >/dev/null && break; sleep 1; done
          node draculas-crypt/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draculas-crypt-smoke-screens
          path: artifacts/draculas-crypt/

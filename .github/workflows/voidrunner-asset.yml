name: VOIDRUNNER asset candidate
on:
  push:
    branches: ['voidrunner/asset-first-v025']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/voidrunner-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/voidrunner/ >/dev/null && break; sleep 1; done
          node voidrunner/smoke-asset.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voidrunner-asset-screens
          path: artifacts/voidrunner/

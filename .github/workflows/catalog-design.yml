name: Catalog typography and motion audit
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/brand/**', 'tests/catalog-design.mjs', '.github/workflows/catalog-design.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Test font, layout, interactions and motion
        run: |
          mkdir -p "$RUNNER_TEMP/site" audit-artifacts
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/site/euclidi-games"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/euclidi-games/ >/dev/null && break; sleep 1; done
          node tests/catalog-design.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-design-screenshots
          path: audit-artifacts/
          if-no-files-found: ignore

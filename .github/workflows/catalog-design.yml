name: Catalog typography and motion audit
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/brand/**', 'tests/catalog-design.mjs', '.github/workflows/catalog-design.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-and-published:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium firefox
      - name: Test actual local animation movement and layout
        run: |
          mkdir -p "$RUNNER_TEMP/site" audit-artifacts
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/site/euclidi-games"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/euclidi-games/ -o /tmp/catalog.html && break; sleep 1; done
          node tests/catalog-design.mjs
          mv audit-artifacts local-audit-artifacts
      - name: Verify published revision, matching asset bytes and actual motion
        if: always() && !cancelled()
        run: |
          BASE=https://euclidi.github.io/euclidi-games/
          for i in $(seq 1 30); do
            if curl -fsS "${BASE}?design-audit=$GITHUB_RUN_ID-$i" -o /tmp/live-catalog.html && grep -q 'data-design-revision="10"' /tmp/live-catalog.html && curl -fsS "${BASE}assets/brand/catalog-retro.css?v=12" -o /tmp/live-catalog.css && cmp -s /tmp/live-catalog.css assets/brand/catalog-retro.css; then break; fi
            sleep 10
          done
          grep -q 'data-design-revision="10"' /tmp/live-catalog.html
          cmp /tmp/live-catalog.css assets/brand/catalog-retro.css
          curl -fsS "${BASE}assets/brand/catalog-motion.js?v=7" -o /tmp/live-motion.js
          cmp /tmp/live-motion.js assets/brand/catalog-motion.js
          CATALOG_URL="$BASE" node tests/catalog-design.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-design-revision-10
          path: |
            audit-artifacts/
            local-audit-artifacts/
          if-no-files-found: warn

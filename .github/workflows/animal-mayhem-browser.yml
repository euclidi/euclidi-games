name: Animal Mayhem validation
on:
  push:
    branches: [animal-mayhem-development, main]
    paths: ['animal-mayhem/**', '.github/workflows/animal-mayhem-browser.yml']
  pull_request:
    paths: ['animal-mayhem/**', '.github/workflows/animal-mayhem-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check animal-mayhem/game.mjs && node animal-mayhem/tests.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/animal-mayhem-http.log 2>&1 &
          node animal-mayhem/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animal-mayhem-gameplay
          path: animal-mayhem-gameplay.png

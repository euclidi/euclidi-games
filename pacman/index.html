<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maze Arcade / 1980</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff}main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px}#screen{position:relative;flex:none;overflow:hidden;background:#000}#board{width:100%;height:100%;touch-action:none}canvas{display:block;image-rendering:pixelated}.crt:after{position:absolute;inset:0;content:'';pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,#0005 2px 3px)}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:390px}button{display:flex;align-items:center;justify-content:center;background:#000;color:#fff;border:1px solid #2121ff;border-radius:0;min-height:36px;padding:8px;touch-action:none}button:active{background:#18185e}button canvas{height:14px;width:auto}#start{border-color:#ff0}#pad{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:clamp(198px,62vw,240px);aspect-ratio:1;touch-action:none;user-select:none;gap:3px;flex:none}#pad button{min-height:0;padding:0;background:#09091c;border:2px solid #3737c2}#pad button:after{content:'';width:0;height:0;border:13px solid transparent}#pad button[data-dir="0"]{grid-area:1/2}#pad button[data-dir="0"]:after{border-bottom-color:#eee;transform:translateY(-7px)}#pad button[data-dir="1"]{grid-area:2/1}#pad button[data-dir="1"]:after{border-right-color:#eee;transform:translateX(-7px)}#pad button[data-dir="2"]{grid-area:3/2}#pad button[data-dir="2"]:after{border-top-color:#eee;transform:translateY(7px)}#pad button[data-dir="3"]{grid-area:2/3}#pad button[data-dir="3"]:after{border-left-color:#eee;transform:translateX(7px)}#pad i{grid-area:2/2;background:#09091c;border:1px solid #3737c2}#pad[data-active="0"] [data-dir="0"],#pad[data-active="1"] [data-dir="1"],#pad[data-active="2"] [data-dir="2"],#pad[data-active="3"] [data-dir="3"]{background:#3434aa}.land main{display:grid;grid-template-columns:minmax(92px,1fr) auto minmax(180px,1.25fr);grid-template-rows:1fr;gap:8px}.land #screen{grid-column:2;grid-row:1}.land .controls{grid-column:1;grid-row:1;flex-direction:column;align-items:stretch;justify-self:center}.land #pad{grid-column:3;grid-row:1;width:clamp(180px,27vw,240px);justify-self:center}@media(min-width:900px) and (min-height:650px){#pad{width:216px}}
#boot{position:absolute;inset:0;display:grid;place-content:center;padding:12px;text-align:center;background:#000;color:#ffff00;font:12px monospace;z-index:9}#boot[hidden]{display:none}
[hidden]{display:none!important}#menu-help{display:none;font:10px/1.5 monospace;color:#a7a7ba;text-align:center;padding:0 8px}.title-open #pad{display:none}.title-open #menu-help{display:block}.title-open .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:min(390px,calc(100vw - 24px));gap:6px}.title-open .controls #start,.title-open .controls #resume,.title-open .controls #mode{grid-column:1/-1}.title-open .controls button{min-height:42px}.title-open .controls button canvas{max-width:100%;object-fit:contain}.title-open #start{background:#171700;border:2px solid #ffff00;min-height:48px}.title-open #resume{border-color:#ffff00}button:focus-visible{outline:2px solid #ffff00;outline-offset:2px}button{cursor:pointer}

#pad[data-active="0"] [data-dir="0"],#pad[data-active="1"] [data-dir="1"],#pad[data-active="2"] [data-dir="2"],#pad[data-active="3"] [data-dir="3"]{background:#ffff00;border-color:#ffff00;box-shadow:inset 0 0 0 2px #b7ad00}
#pad[data-active="0"] [data-dir="0"]:after{border-bottom-color:#161600}#pad[data-active="1"] [data-dir="1"]:after{border-right-color:#161600}#pad[data-active="2"] [data-dir="2"]:after{border-top-color:#161600}#pad[data-active="3"] [data-dir="3"]:after{border-left-color:#161600}
#touch-toggle{border-color:#8888c8}#joystick{width:clamp(198px,62vw,240px);aspect-ratio:1;flex:none;touch-action:none;user-select:none;cursor:grab}#joystick:active{cursor:grabbing}#stick-art{width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.title-open #joystick{display:none}.title-open #touch-toggle{grid-column:1/-1}.land #joystick{grid-column:3;grid-row:1;width:clamp(180px,27vw,240px);justify-self:center}.land.touch-off main{grid-template-columns:minmax(100px,1fr) auto;justify-content:center}.land.touch-off #screen{grid-column:2}#release-mark{font:9px monospace;color:#777;text-align:center}.land #release-mark{position:fixed;bottom:3px;right:5px}
</style></head><body class="title-open"><main><div id="screen"><div id="board"><noscript>Enable JavaScript to play.</noscript></div><div id="boot" role="status">LOADING GAME...</div></div><div class="controls"><button id="start">START GAME</button><button id="resume" hidden>RESUME GAME</button><button id="pause" hidden>PAUSE</button><button id="menu" hidden>MAIN MENU</button><button id="mode">MODE HYBRID</button><button id="sound">SOUND</button><button id="crt">CRT OFF</button><button id="touch-toggle" aria-label="Touch controls">CONTROL PAD</button></div><div id="pad" aria-label="Directional control pad"><button data-dir="0" aria-label="Up"></button><button data-dir="1" aria-label="Left"></button><i></i><button data-dir="2" aria-label="Down"></button><button data-dir="3" aria-label="Right"></button></div><div id="joystick" hidden role="group" aria-label="Four-way red arcade joystick"><canvas id="stick-art" width="112" height="112" aria-label="Drag the red joystick to move"></canvas></div><div id="menu-help">LEFT / RIGHT TO CHANGE MODE · ENTER TO START</div><div id="release-mark">V1.4.4</div></main><script type="module">const boot=document.getElementById('boot');window.addEventListener('error',e=>{boot.hidden=false;boot.textContent='GAME ERROR: '+e.message});window.addEventListener('unhandledrejection',e=>{boot.hidden=false;boot.textContent='GAME ERROR: '+String(e.reason)});import('./src/main.js?v=144').catch(e=>{boot.hidden=false;boot.textContent='GAME ERROR: '+e.message});</script></body></html>

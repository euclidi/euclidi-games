<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maze Arcade / 1980</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff}main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px}#screen{position:relative;flex:none;overflow:hidden;background:#000}#board{width:100%;height:100%;touch-action:none}canvas{display:block;image-rendering:pixelated}.crt:after{position:absolute;inset:0;content:'';pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,#0005 2px 3px)}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:390px}button{display:flex;align-items:center;justify-content:center;background:#000;color:#fff;border:1px solid #2121ff;border-radius:0;min-height:36px;padding:8px;touch-action:none}button:active{background:#18185e}button canvas{height:14px;width:auto}#start{border-color:#ff0}#pad{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:clamp(198px,62vw,240px);aspect-ratio:1;touch-action:none;user-select:none;gap:3px;flex:none}#pad button{min-height:0;padding:0;background:#09091c;border:2px solid #3737c2}#pad button:after{content:'';width:0;height:0;border:13px solid transparent}#pad button[data-dir="0"]{grid-area:1/2}#pad button[data-dir="0"]:after{border-bottom-color:#eee;transform:translateY(-7px)}#pad button[data-dir="1"]{grid-area:2/1}#pad button[data-dir="1"]:after{border-right-color:#eee;transform:translateX(-7px)}#pad button[data-dir="2"]{grid-area:3/2}#pad button[data-dir="2"]:after{border-top-color:#eee;transform:translateY(7px)}#pad button[data-dir="3"]{grid-area:2/3}#pad button[data-dir="3"]:after{border-left-color:#eee;transform:translateX(7px)}#pad i{grid-area:2/2;background:#09091c;border:1px solid #3737c2}#pad[data-active="0"] [data-dir="0"],#pad[data-active="1"] [data-dir="1"],#pad[data-active="2"] [data-dir="2"],#pad[data-active="3"] [data-dir="3"]{background:#3434aa}.land main{display:grid;grid-template-columns:minmax(92px,1fr) auto m

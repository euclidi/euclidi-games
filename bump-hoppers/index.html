 drawActors(){let p=this.xy(this.p),h=this.hop,z=0,sx=1,sy=1,depth=this.p.r*100+70;if(h){let u=Math.min(1,h.t/h.d),a=this.xy(h.from),b=this.xy(h.to);p={x:Phaser.Math.Linear(a.x,b.x,u),y:Phaser.Math.Linear(a.y,b.y,u)};z=Math.sin(Math.PI*u)*this.step*.66+(h.fall?Math.max(0,u-.5)*100:0)*-1;sy=1+.14*Math.sin(Math.PI*u);sx=1-.08*Math.sin(Math.PI*u);depth=Math.max(h.from.r,h.to.r)*100+80;if(h.fall)depth=900}else if(this.land>0){let u=this.land/155;sy=1-.25*u;sx=1+.23*u}let size=1;this.hero.setTexture((!h&&this.land>65?'squash':'hero')+this.dir).setPosition(Math.round(p.x),Math.round(p.y-z)).setScale(1).setDepth(depth).setAlpha(this.inv>0&&Math.floor(this.inv/110)%2?.65:1);this.shadow.setPosition(p.x,p.y+1).setScale(Math.max(.4,1-z/130)*size).setDepth(depth-1);for(const f of this.foes){let q=this.xy(f.p),zz=0,dd=f.p.r*100+60;if(f.hop){let u=Math.min(1,f.hop.t/f.hop.d),a=this.xy(f.hop.from),b=this.xy(f.hop.to);q={x:Phaser.Math.Linear(a.x,b.x,u),y:Phaser.Math.Linear(a.y,b.y,u)};zz=Math.sin(Math.PI*u)*13;dd=Math.max(f.hop.from.r,f.hop.to.r)*100+60}f.s.setPosition(Math.round(q.x),Math.round(q.y-zz)).setDepth(dd)}this.board.sort('depth')}
 togglePause(){if(this.mode==='play'){this.mode='pause';this.show('PAUSED','Take a moment. Your round is preserved.','RESUME');$('pause').textContent='Resume'}else if(this.mode==='pause'){this.mode='play';this.hide();$('pause').textContent='Pause'}}
 update(_,dt){dt=Math.min(dt,40);let pad=navigator.getGamepads?.()[0];if(pad){let x=pad.axes[0]||0,y=pad.axes[1]||0;let d=pad.buttons[12]?.pressed?0:pad.buttons[15]?.pressed?1:pad.buttons[14]?.pressed?2:pad.buttons[13]?.pressed?3:Math.abs(x)+Math.abs(y)>.65?(y<0?(x<0?0:1):(x<0?2:3)):-1;if(d!==-1&&d!==this.padPrev)this.move(d);this.padPrev=d;let a=pad.buttons[0]?.pressed;if(a&&!this.padA)this.action();this.padA=a}if(this.mode!=='play')return;this.inv=Math.max(0,this.inv-dt);this.land=Math.max(0,this.land-dt);if(this.hop){this.hop.t+=dt;if(this.hop.t>=this.hop.d)this.finishHop()}if(this.mode!=='play')return;this.enemyClock-=dt;this.spawnClock-=dt;if(this.spawnClock<=0){this.spawn();this.spawnClock=Math.max(3000,7600-this.level*500)}if(this.enemyClock<=0){this.stepEnemies();this.enemyClock=Math.max(490,1150-this.level*70)}for(const f of this.foes){if(!f.hop)continue;f.hop.t+=dt;if(f.hop.t>=f.hop.d){f.p=f.hop.to;f.hop=null;if(f.type==='eraser'){let t=this.tiles.find(t=>R.distance(t,f.p)===0);if(t){t.v=Math.max(0,t.v-1);t.s.setTexture('tile'+t.v);this.hud()}}}}this.collision();this.drawActors()}
}
new Phaser.Game({type:Phaser.AUTO,parent:'stage',width:W,height:H,backgroundColor:'#000000',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Game,audio:{noAudio:true},input:{gamepad:false},render:{antialias:false,pixelArt:true,roundPixels:true}});for(const b of document.querySelectorAll('[data-dir]'))b.addEventListener('pointerdown',e=>{e.preventDefault();scene?.move(+b.dataset.dir)});$('menu-action').addEventListener('click',()=>scene?.action());$('pause').onclick=()=>scene?.togglePause();$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'Sound off':'Sound on';if(!muted)tone(220,160,.12)};window.addEventListener('error',e=>{if(!scene||!scene.hero){$('load').hidden=false;$('load').textContent='Game could not start: '+e.message}});}

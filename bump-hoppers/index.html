<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>if(!window.Phaser){document.getElementById('load').textContent='Phaser could not load. Check your connection and reload.'}else{const R=(function rules(){
 const dirs=[[-1,-1],[-1,0],[1,0],[1,1]];
 const valid=(n,r,c)=>r>=0&&r<n&&c>=0&&c<=r;
 const key=(r,c)=>r+":"+c;
 const tiles=n=>Array.from({length:n},(_,r)=>Array.from({length:r+1},(_,c)=>({r,c,v:0}))).flat();
 const goal=(level)=>level>=4?2:1;
 const paint=(v,level)=>level>=7?(v+1)%3:Math.min(goal(level),v+1);
 const distance=(a,b)=>Math.abs(a.c-b.c)+Math.abs((a.r-a.c)-(b.r-b.c));

})(); 
const W=640,H=740;let scene,muted=false,audio=null;const $=id=>document.getElementById(id);let best=0;try{best=+localStorage.getItem('bump-best')||0}catch{}
function tone(f=120,fall=60,d=.18,vol=.12,type='sine'){if(muted)return;try{audio ||=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,fall),t+d);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02)}catch{}}
function rand(x,y){let a=Math.sin(x*127.1+y*311.7)*43758.5453;return a-Math.floor(a)}

const pink=['#f8b6a3','#df817c','#a94856','#713442'],light=['#ffdfc4','#ef9f91','#c45b64','#843a48'],purple=['#c6acdb','#9b7ab8','#664983','#392b55'],green=['#e1dda1','#a6bc73','#5f8053','#344b3a'],cream=['#fff5dc','#f7e5c2','#c0a992','#8b726b'],dark=['#59505b','#34303b','#201d2a','#18151e'];

function mascot(g,w,h,dir){let back=dir<2,side=dir===0||dir===2?-1:1;g.save();if(side<0){g.translate(w,0);g.scale(-1,1)}
clay(g,63,55,23,29,pink,-.28);clay(g,49,29,8,19,pink,-.48);clay(g,73,24,8,19,pink,.32);
clay(g,44,75,12,19,pink,.45);clay(g,89,74,11,17,pink,-.6);
clay(g,42,91,33,32,pink,-.19);clay(g,82,90,35,33,light,.16);
g.strokeStyle='#a74d5a';g.lineWidth=1.7;g.lineCap='round';g.beginPath();g.moveTo(61,89);g.quadraticCurveTo(58,109,64,118);g.stroke();
if(!back){clay(g,65,47,12,13,cream);clay(g,81,49,10,12,cream);clay(g,69,49,5,6,dark);clay(g,84,51,4,5,dark);clay(g,80,63,8,4,pink);g.strokeStyle='#713442';g.lineWidth=2;g.beginPath();g.moveTo(72,65);g.quadraticCurveTo(79,71,87,65);g.stroke();}else{clay(g,82,47,7,9,cream);clay(g,85,48,3,5,dark);}
g.restore();grain(g,w,h)}
function tile(g,w,h,state){const sets=[['#c9ad83','#92775b','#705743'],['#eab25d','#b67c3e','#87572f'],['#a9c88a','#648759','#486547']];let p=sets[state];
function face(coords,c1,c2){let z=g.createLinearGradient(0,8,15,105);z.addColorStop(0,c1);z.addColorStop(1,c2);g.fillStyle=z;g.strokeStyle='#54463f';g.lineWidth=1.3;g.lineJoin='round';g.beginPath();coords.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill();g.stroke()}
face([[4,34],[64,64],[64,112],[4,81]],p[1],p[2]);face([[64,64],[124,34],[124,81],[64,112]],p[2],p[1]);face([[64,4],[124,34],[64,64],[4,34]],p[0],p[1]);g.strokeStyle='#fff3ca55';g.lineWidth=2;g.beginPath();g.moveTo(8,34);g.lineTo(64,7);g.lineTo(120,34);g.stroke();grain(g,w,h)}
function enemy(g,w,h,type){let p=type==='chaser'?purple:type==='eraser'?green:['#f1b57b','#c47b47','#955135','#5a332d'];if(type==='chaser'){for(let i=0;i<8;i++){let a=i*Math.PI/4;clay(g,48+Math.cos(a)*24,46+Math.sin(a)*23,13,16,p,a)}}
clay(g,48,49,32,31,p);clay(g,35,43,12,15,cream);clay(g,60,43,12,15,cream);clay(g,39,47,5,7,dark);clay(g,56,47,5,7,dark);g.strokeStyle=p[3];g.lineWidth=4;g.beginPath();g.moveTo(24,30);g.lineTo(42,35);g.moveTo(71,30);g.lineTo(54,35);g.stroke();clay(g,35,76,12,7,p);clay(g,62,76,12,7,p);grain(g,w,h)}
class Game extends Phaser.Scene{

 this.add.image(320,370,'back');this.board=this.add.container();this.ui=this.add.container().setDepth(5000);this.label=this.add.text(24,20,'',{fontFamily:'Georgia',fontSize:'19px',color:'#ffebcd',lineSpacing:7});this.right=this.add.text(616,20,'',{fontFamily:'Georgia',fontSize:'18px',color:'#ffebcd',align:'right'}).setOrigin(1,0);this.note=this.add.text(320,705,'',{fontFamily:'Georgia',fontSize:'18px',color:'#f7d8af',align:'center'}).setOrigin(.5);this.ui.add([this.label,this.right,this.note]);this.mode='title';this.show('BUMP HOPPERS','A hand-moulded arcade oddity\nBounce on every cube. Avoid the critters.\nDo not bounce into the void.','START');this.input.keyboard.on('keydown',e=>{let m={ArrowUp:0,ArrowRight:1,ArrowLeft:2,ArrowDown:3,q:0,e:1,z:2,c:3,w:0,d:1,a:2,s:3};if(e.key in m){e.preventDefault();this.move(m[e.key])}else if(e.key==='Enter'||e.key===' '){e.preventDefault();this.action()}else if(e.key==='Escape'||e.key==='p')this.togglePause()});this.input.on('pointerdown',p=>{if(this.mode!=='play')return;let n=R.neighbors(this.n,this.p),q=n.find(t=>{let a=this.xy(t);return Math.abs(p.x-a.x)/this.step+Math.abs(p.y-a.y)/(this.step*.5)<.85});if(q){let i=R.dirs.findIndex(([r,c])=>r===q.r-this.p.r&&c===q.c-this.p.c);this.move(i)}});
 this.padPrev=-1;this.game.events.on('blur',()=>{if(this.mode==='play')this.togglePause()});this.newRun(false)}
 show(title,body,action){if(this.overlay)this.overlay.destroy(true);let bg=this.add.rectangle(320,352,560,280,0x302a38,.97).setStrokeStyle(2,0xb79b83),t=this.add.text(320,265,title,{fontFamily:'Georgia',fontSize:'39px',color:'#f8c998',fontStyle:'bold',align:'center'}).setOrigin(.5),b=this.add.text(320,340,body,{fontFamily:'Georgia',fontSize:'19px',color:'#f4dfc6',align:'center',lineSpacing:8,wordWrap:{width:480}}).setOrigin(.5),btn=this.add.rectangle(320,438,240,50,0x925b63).setStrokeStyle(1,0xd8ab96).setInteractive({useHandCursor:true}),bt=this.add.text(320,438,action,{fontFamily:'Georgia',fontSize:'22px',color:'#fff0d3'}).setOrigin(.5);btn.on('pointerdown',()=>this.action());this.overlay=this.add.container(0,0,[bg,t,b,btn,bt]).setDepth(6000)}
 hide(){if(this.overlay){this.overlay.destroy(true);this.overlay=null}}
 action(){if(this.mode==='title'||this.mode==='over'){this.newRun(true)}else if(this.mode==='clear'){this.level++;this.startLevel();this.mode='play';this.hide()}else if(this.mode==='pause'){this.togglePause()}}
 newRun(play){this.level=1;this.score=0;this.lives=3;this.startLevel();this.mode=play?'play':'title';if(play)this.hide()}
 xy(p){return {x:320+(2*p.c-p.r)*this.step/2,y:156+p.r*this.step*.76}}
 startLevel(){this.board.removeAll(true);this.n=Math.min(7,4+Math.ceil(this.level/2));this.step=Math.min(105,535/this.n);this.tiles=R.tiles(this.n);this.goal=R.goal(this.level);this.p={r:0,c:0};this.p.v=0;this.hop=null;this.queue=null;this.clock=0;this.inv=1300;this.land=0;this.enemyClock=2300;this.spawnClock=4200;this.foes=[];this.discs=[];this.fx=[];this.dir=3;
 for(const t of this.tiles){let q=this.xy(t);t.s=this.add.image(q.x,q.y,'tile0').setOrigin(.5,34/120).setScale(this.step/124).setDepth(t.r*100+t.c);this.board.add(t.s)}
 for(let side of [0,1]){let p={r:2,c:side?3:-1},q=this.xy(p);let disc=this.add.ellipse(q.x,q.y,54,26,0xe0aa72).setStrokeStyle(4,0x977454);this.board.add(disc);this.discs.push({p,s:disc,used:false})}
 this.shadow=this.add.ellipse(0,0,37,13,0x352631,.35);this.hero=this.add.image(0,0,'hero3').setOrigin(.5,.97);this.board.add([this.shadow,this.hero]);this.paint(this.p,false);this.drawActors();this.hud()}
 paint(p,score=true){let t=this.tiles.find(t=>t.r===p.r&&t.c===p.c);if(!t)return;let old=t.v;t.v=R.paint(old,this.level);t.s.setTexture('tile'+t.v);if(score&&old!==t.v){this.score+=t.v===this.goal?25:10;this.record();tone(320+t.v*90,220,.13,.075,'triangle')}}
 record(){if(this.score>best){best=this.score;try{localStorage.setItem('bump-best',String(best))}catch{}}}

 move(i){if(this.mode!=='play')return;if(this.hop){this.queue=i;return}let [r,c]=R.dirs[i],q={r:this.p.r+r,c:this.p.c+c};this.dir=i;let disc=this.discs.find(d=>!d.used&&d.p.r===q.r&&d.p.c===q.c);this.hop={from:{...this.p},to:q,t:0,d:285,disc,fall:!disc&&!R.valid(this.n,q.r,q.c)};tone(160,290,.11,.065,'triangle')}
 lose(){this.lives--;this.hop=null;this.queue=null;tone(190,40,.35,.13,'sawtooth');if(this.lives<=0){this.mode='over';this.show('GAME OVER','Score '+this.score+'  ·  Round '+this.level,'TRY AGAIN');this.hero.setVisible(false)}else{this.p={r:0,c:0};this.inv=1900;this.land=160;for(const f of this.foes)f.s.destroy();this.foes=[];this.enemyClock=1800;this.spawnClock=2600;this.hero.setVisible(true)}this.hud()}
 finishHop(){let h=this.hop;this.hop=null;if(h.fall){this.lose();return}if(h.disc){h.disc.used=true;h.disc.s.setVisible(false);this.p={r:0,c:0};this.inv=1400;this.score+=100;this.record();tone(430,680,.24,.09,'triangle')}else{this.p=h.to;this.paint(this.p);tone(105,43,.17,.16)}this.land=155;this.collision();if(this.mode!=='play')return;if(this.tiles.every(t=>t.v===this.goal)){this.score+=500+this.level*100;this.record();this.mode='clear';this.queue=null;this.show('ROUND CLEAR','All cubes changed. Bonus '+(500+this.level*100)+'.','NEXT ROUND');tone(520,880,.34,.12,'triangle')}this.hud();if(this.queue!==null&&this.mode==='play'&&!this.hop){let q=this.queue;this.queue=null;this.move(q)}}
 spawn(){if(this.foes.length>=Math.min(4,1+Math.floor(this.level/2)))return;let types=['roller','chaser','eraser'],type=types[Math.min(this.level>=3?2:1,this.foes.length+(this.level>2?1:0))],p={r:Math.min(2,this.n-1),c:Math.random()<.5?0:2};if(R.distance(p,this.p)<2)p={r:this.n-1,c:this.p.c===0?this.n-1:0};let s=this.add.image(0,0,type).setOrigin(.5,.92).setScale(this.step/110);this.board.add(s);this.foes.push({p,s,type,hop:null,age:0})}
 stepEnemies(){for(const f of this.foes){if(f.hop)continue;let opts=R.neighbors(this.n,f.p);if(f.type==='roller'){opts=opts.filter(q=>q.r>f.p.r);if(!opts.length){f.s.destroy();f.dead=true;continue}}else if(f.type==='chaser'){opts.sort((a,b)=>R.distance(a,this.p)-R.distance(b,this.p));opts=opts.slice(0,Math.random()<.82?1:2)}let q=opts[Math.floor(Math.random()*opts.length)];if(q)f.hop={from:f.p,to:q,t:0,d:350}}this.foes=this.foes.filter(f=>!f.dead)}
 collision(){if(this.inv>0||this.hop)return;for(const f of this.foes){if(!f.hop&&R.distance(f.p,this.p)===0){this.lose();break}}}
 drawActors(){let p=this.xy(this.p),h=this.hop,z=0,sx=1,sy=1,depth=this.p.r*100+70;if(h){let u=Math.min(1,h.t/h.d),a=this.xy(h.from),b=this.xy(h.to);p={x:Phaser.Math.Linear(a.x,b.x,u),y:Phaser.Math.Linear(a.y,b.y,u)};z=Math.sin(Math.PI*u)*this.step*.66+(h.fall?Math.max(0,u-.5)*250:0)*-1;sy=1+.14*Math.sin(Math.PI*u);sx=1-.08*Math.sin(Math.PI*u);depth=Math.max(h.from.r,h.to.r)*100+80;if(h.fall)depth=900}else if(this.land>0){let u=this.land/155;sy=1-.25*u;sx=1+.23*u}let size=this.step/111;this.hero.setTexture('hero'+this.dir).setPosition(p.x,p.y-z).setScale(size*sx,size*sy).setDepth(depth).setAlpha(this.inv>0&&Math.floor(this.inv/110)%2?.65:1);this.shadow.setPosition(p.x,p.y+1).setScale(Math.max(.4,1-z/130)*size).setDepth(depth-1);for(const f of this.foes){let q=this.xy(f.p),zz=0,dd=f.p.r*100+60;if(f.hop){let u=Math.min(1,f.hop.t/f.hop.d),a=this.xy(f.hop.from),b=this.xy(f.hop.to);q={x:Phaser.Math.Linear(a.x,b.x,u),y:Phaser.Math.Linear(a.y,b.y,u)};zz=Math.sin(Math.PI*u)*40;dd=Math.max(f.hop.from.r,f.hop.to.r)*100+60}f.s.setPosition(q.x,q.y-zz).setDepth(dd)}this.board.sort('depth')}
 togglePause(){if(this.mode==='play'){this.mode='pause';this.show('PAUSED','Take a moment. Your round is preserved.','RESUME');$('pause').textContent='Resume'}else if(this.mode==='pause'){this.mode='play';this.hide();$('pause').textContent='Pause'}}
 update(_,dt){dt=Math.min(dt,40);let pad=navigator.getGamepads?.()[0];if(pad){let x=pad.axes[0]||0,y=pad.axes[1]||0;let d=pad.buttons[12]?.pressed?0:pad.buttons[15]?.pressed?1:pad.buttons[14]?.pressed?2:pad.buttons[13]?.pressed?3:Math.abs(x)+Math.abs(y)>.65?(y<0?(x<0?0:1):(x<0?2:3)):-1;if(d!==-1&&d!==this.padPrev)this.move(d);this.padPrev=d;let a=pad.buttons[0]?.pressed;if(a&&!this.padA)this.action();this.padA=a}if(this.mode!=='play')return;this.inv=Math.max(0,this.inv-dt);this.land=Math.max(0,this.land-dt);if(this.hop){this.hop.t+=dt;if(this.hop.t>=this.hop.d)this.finishHop()}if(this.mode!=='play')return;this.enemyClock-=dt;this.spawnClock-=dt;if(this.spawnClock<=0){this.spawn();this.spawnClock=Math.max(3000,7600-this.level*500)}if(this.enemyClock<=0){this.stepEnemies();this.enemyClock=Math.max(490,1150-this.level*70)}for(const f of this.foes){if(!f.hop)continue;f.hop.t+=dt;if(f.hop.t>=f.hop.d){f.p=f.hop.to;f.hop=null;if(f.type==='eraser'){let t=this.tiles.find(t=>R.distance(t,f.p)===0);if(t){t.v=Math.max(0,t.v-1);t.s.setTexture('tile'+t.v);this.hud()}}}}this.collision();this.drawActors()}
}
new Phaser.Game({type:Phaser.AUTO,parent:'stage',width:W,height:H,backgroundColor:'#292a38',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Game,audio:{noAudio:true},input:{gamepad:false},render:{antialias:true}});for(const b of document.querySelectorAll('[data-dir]'))b.addEventListener('pointerdown',e=>{e.preventDefault();if(scene?.mode==='title')scene.action();else scene?.move(+b.dataset.dir)});$('pause').onclick=()=>scene?.togglePause();$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'Sound off':'Sound on';if(!muted)tone(220,160,.12)};window.addEventListener('error',e=>{if(!scene){$('load').hidden=false;$('load').textContent='Game could not start: '+e.message}});}

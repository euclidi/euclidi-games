<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DUMMY LAB</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#1d2020;color:#eee;font:12px monospace}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}#hud{position:absolute;left:14px;top:14px;text-shadow:1px 2px #333;pointer-events:none}h1{font-size:17px;letter-spacing:3px;margin:0 0 6px}#bar{position:absolute;bottom:12px;right:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:85vw}button,select{background:#232827e8;color:#e4e4db;border:1px solid #9ca4a0;padding:10px;font:12px monospace;border-radius:0;touch-action:none}#panel{position:absolute;right:12px;top:14px;width:min(310px,80vw);padding:12px;background:#202525ed;border:1px solid #9ca4a0;line-height:1.6;display:none}#panel select{width:100%;margin:8px 0}#pad{position:absolute;bottom:72px;left:12px;display:grid;grid-template-columns:repeat(3,42px);gap:3px}#pad button{height:42px;padding:0}#load{position:absolute;inset:0;display:grid;place-items:center;background:#1d2020;white-space:pre-wrap;padding:15px}#cross{position:absolute;left:50%;top:50%;width:3px;height:3px;background:#eee;pointer-events:none}@media(pointer:fine){#pad{display:none}}</style><link rel="stylesheet" href="controls.css?v=1.10"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","@dimforge/rapier3d-compat":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.17.3/rapier.es.js"}}</script></head><body><div id="hud"><h1>DUMMY LAB / W1.10</h1><span id="state">INITIALIZING</span><span id="input-status" aria-live="polite"></span></div><div id="cross"></div><div id="inputdock"><div id="touch-controls"><div id="pad" role="group" aria-label="Analog movement joystick"><span id="stick"><i></i></span></div><span id="touchhint">DRAG VIEW TO LOOK</span><div id="elevation" hidden><button data-key="e">UP</button><button data-key="q">DOWN</button></div></div><div id="bar"><button id="camera">PLAYER</button><button id="lamp">EXPOSURE MID</button><button id="speed">1×</button><button id="resolution">480P</button><button id="actions">ACTIONS</button><button id="reset">RESET</button><button id="fullscreen" aria-label="Toggle fullscreen">FULL</button></div></div><div id="panel"><div class="panelhead"><strong>ACTION PREVIEW</strong><button id="close-actions">CLOSE</button></div><select id="choice"></select><button id="play">PLAY</button> <button id="auto">AUTO</button> <button id="noise">NOISE</button><hr><span id="metrics"></span><hr><button id="export">EXPORT LOG</button><details id="inputsettings"><summary>Controls / gamepad</summary><p>Left stick: move. Right stick: look. LB/RB: descend/ascend in free camera. A: noise. B: camera. X: slow motion. Y/Start: actions. D-pad: move or select actions.</p><label>Non-standard right stick<select id="padmap"><option value="0">Axes 2 / 3</option><option value="1">Axes 3 / 4</option></select></label><label>Touch controls<select id="touchmode"><option value="auto">Automatic</option><option value="on">Always show</option><option value="off">Hide</option></select></label></details></div><div id="load">INITIALIZING TEST FACILITY</div><script type="module">import('./main.js?v=1.10').catch(e=>{const l=document.getElementById('load');if(l)l.textContent='DUMMY LAB / LOAD FAILED\n'+String(e.message||e)+'\nCheck internet access to the dependency CDN.';console.error(e);});</script></body></html>

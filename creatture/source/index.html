<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Creatture — development build</title></head><body><main id="lab"><header><a href="https://euclidi.github.io/euclidi-games/" data-catalog-return aria-label="Return to Euclidi Games catalog">EUCLIDI</a><strong>CREATTURE</strong><span>RESEARCH BUILD / 0.1</span><label title="Reduced motion"><input type="checkbox" id="reduced"> Reduced motion</label><button id="sound" aria-pressed="false">Sound off</button><button id="settings" aria-expanded="false">Settings</button></header><section id="settings-panel" hidden><label>Ambience <input id="music" type="range" min="0" max="1" step=".05" value=".55"></label><label>Effects <input id="effects" type="range" min="0" max="1" step=".05" value=".7"></label><label>Resolution <select id="quality"><option value="1280">1280 adaptive</option><option value="960">960 adaptive</option><option value="640">640 adaptive</option></select></label><button id="export">Export specimen</button><button id="verify-replay">Verify puzzle replay</button></section><section id="toolbar"><label>Habitat <select id="world"></select></label><label>Experiment <select id="mode"><option value="puzzle">Evolution puzzle</option><option value="free">Free cultivation</option><option value="archive">Specimen archive</option></select></label><button id="reset">New specimen</button><button id="inspect" aria-pressed="false">Anatomy</button><button id="save">Preserve</button></section><section id="workspace"><div id="stage"><div id="viewport" aria-label="Three-dimensional specimen habitat"></div><div id="caption"><strong id="name">Loading engine…</strong><span id="status" role="status">Initializing WebAssembly</span></div><button id="camera">Composed view</button></div><aside id="panel" hidden><h2>Live specimen</h2><pre id="readout"></pre></aside></section><section id="archive" hidden><label>Preserved specimens <select id="samples"></select></label><button id="restore">Observe</button><button id="breed">Breed with current</button><button id="transfer">Cultivate in habitat</button></section><section id="experiment" hidden><label>Dose <input id="dose" type="range" min=".25" max="2" step=".25" value="1"></label><label>Water <input id="water" type="range" min="0" max="1" step=".05"></label><label>Light <input id="light" type="range" min="0" max="1" step=".05"></label><label>Heat <input id="heat" type="range" min="0" max="1" step=".05"></label><label>Time <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="pause">Pause</button><button id="cue">Stimulate</button><button id="damage" title="Injure selected region">Tissue stress</button><label>Relationship <select id="relation"><option value="0">Mutualist</option><option value="1">Parasite</option><option value="2">Competitor</option></select></label><button id="bud">Bud offspring</button></section><section id="tray" aria-label="Biological elements"></section><footer><span id="log">Introduce an element to begin.</span><span id="turn">00 / 12</span></footer></main><script type="module" src="/client/main.ts"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Backyard Astronaut / Unified V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b20;color:#f6ebd4;font:13px ui-monospace,Consolas,monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}button{font:inherit;color:#f4e8cf;background:#26372eea;border:1px solid #859178;padding:10px 12px;cursor:pointer;touch-action:none}button:active{background:#56654b}button:disabled{opacity:.4;cursor:default}#hud{position:absolute;top:14px;left:14px;pointer-events:none;text-shadow:0 2px #111,1px 0 #111;max-width:calc(100% - 28px)}h1{font-size:16px;letter-spacing:2px;margin:0 0 6px}#stats{white-space:pre-line;line-height:1.55}#help{position:absolute;top:14px;right:14px;max-width:250px;text-align:right;color:#f3e7ce;text-shadow:1px 2px #172018;pointer-events:none;line-height:1.5}#notice{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);text-align:center;max-width:90%;padding:8px 12px;background:#17241bdc;border:1px solid #667a62;pointer-events:none}#bar{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}#flight{position:absolute;right:12px;bottom:120px;display:grid;gap:6px;width:155px;background:#122019de;padding:10px;border:1px solid #82917b}#flight label{display:grid;gap:4px}input{width:100%;accent-color:#d1bd86}#pad{position:absolute;bottom:120px;left:12px;display:grid;grid-template-columns:repeat(3,44px);gap:3px}#pad button{height:44px;padding:0}#boot{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#14231e;white-space:pre-wrap;text-align:center;line-height:1.6;z-index:10}#boot[hidden],#flight[hidden],#pad[hidden]{display:none}#reticle{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #f5ebd6aa;pointer-events:none}#inventory{position:absolute;left:14px;top:142px;background:#18231ce8;border:1px solid #82917b;padding:8px;max-width:240px;white-space:pre-line;pointer-events:none}a{color:#e8ddb9}@media(pointer:fine){#pad{display:none}}@media(max-width:680px){#help{display:none}#hud{top:9px;left:9px;font-size:11px}h1{font-size:13px}#inventory{top:116px;left:9px;font-size:10px}button{padding:8px;font-size:11px}#flight{bottom:130px;width:125px;font-size:11px}#notice{bottom:100px;font-size:11px}#pad{bottom:130px}#bar{bottom:8px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","@dimforge/rapier3d-compat":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.17.3/rapier.es.js"}}</script></head><body>
<div id="hud"><h1>BACKYARD ASTRONAUT / V2</h1><div id="stats">Starting engine</div></div><div id="help">WASD walk · drag camera · wheel zoom<br>E pick up / attach · Q drop / detach<br>F board · Space thrust · arrows steer</div><div id="inventory"></div><div id="reticle"></div><div id="notice">Loading the neighborhood…</div>

<script type="module">import('./game.mjs').catch(e=>{document.querySelector('#boot').hidden=false;document.querySelector('#boot').textContent='UNIFIED ENGINE COULD NOT START\n'+e.message+'\nRequires WebGL2 and network access for preview dependencies. Alpha 0.3 remains available.\n';const a=document.createElement('a');a.href='../';a.textContent='Return to Alpha 0.3';document.querySelector('#boot').append(a);console.error(e)});</script></body></html>

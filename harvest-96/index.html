<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Harvest '96 — rural life development build</title><style>*{box-sizing:border-box}html,body{margin:0;background:#242d26;color:#f5e5b9;font:14px monospace}body{min-height:100dvh}button,select{font:inherit;color:inherit;background:#344237;border:2px solid #9e9871;padding:8px;touch-action:manipulation}button:active{background:#6c7750}button:focus-visible{outline:2px solid #f1d480}header{display:flex;justify-content:space-between;gap:6px;padding:8px 12px;align-items:center}a{color:inherit}#layout{display:grid;grid-template-columns:minmax(0,640px) minmax(210px,300px);justify-content:center;gap:12px;padding:0 10px 12px}#screen{width:100%;aspect-ratio:8/7;background:#111;image-rendering:pixelated;position:relative;overflow:hidden}canvas{image-rendering:pixelated!important;display:block}#hud{padding:8px;background:#3a4837;border:2px solid #aa9b70;line-height:1.5}#msg{min-height:3em;padding:8px;white-space:normal}#panel{background:#2d392e;border:2px solid #9e9871;padding:10px;overflow:auto;max-height:75dvh}#panel h2{font-size:16px;margin:8px 0}#panel p{margin:6px 0}#tabs,#tools,#travel{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}#tools button[aria-pressed=true]{background:#867748;color:white}#pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:3px;justify-content:center}#pad button{padding:0;touch-action:none}#controls{display:flex;justify-content:space-between;align-items:center;padding:8px}#act{min-width:94px;min-height:55px}#boot{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1;background:#202921}#boot[hidden]{display:none}@media(max-width:750px){#layout{grid-template-columns:minmax(0,640px)}#panel{max-height:none}#screen{max-height:62dvh;aspect-ratio:8/7}header{font-size:11px}}@media(orientation:landscape) and (max-height:550px){#layout{grid-template-columns:minmax(0,58vw) minmax(0,38vw);gap:6px}#screen{max-height:63dvh}#controls{padding:2px}#panel{max-height:84dvh}#pad{grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,29px)}} </style></head><body><header><strong>HARVEST '96 / DEVELOPMENT</strong><a href="../">EUCLIDI GAMES</a></header><main id="layout"><section><div id="hud">Loading rural world...</div><div id="screen"><div id="boot">Loading Phaser and sprite atlases…</div></div><div id="msg" role="status"></div><div id="controls"><div id="pad"><span></span><button data-move="up" aria-label="Move up">↑</button><span></span><button data-move="left" aria-label="Move left">←</button><span></span><button data-move="right" aria-label="Move right">→</button><span></span><button data-move="down" aria-label="Move down">↓</button></div><button id="act">USE TOOL</button></div><div id="tools"></div></section><aside id="panel"><div id="travel"></div><div id="tabs"></div><section id="details"></section></aside></main><script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js" onerror="document.getElementById('boot').textContent='Phaser could not load. Check network and reload.'"></script><script type="module" src="./game.js"></script></body></html>
